services:
  db:
    image: mariadb:11
    container_name: gta-rp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
      MYSQL_DATABASE: ${DB_NAME:-qbcore}
      MYSQL_USER: ${DB_USER:-qbcore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: gta-rp-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  db-data:
