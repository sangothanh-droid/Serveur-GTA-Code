<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MirageRP - Chargement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>

    <main class="content">
        <div class="server-name">
            <span class="server-name-main">Mirage</span><span class="server-name-accent">RP</span>
        </div>
        <p class="server-subtitle">Serveur roleplay ouvert à tous, sans whitelist</p>

        <div class="progress-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-label" class="progress-label">Connexion en cours...</p>
        </div>

        <div class="tips">
            <p id="tip-text" class="tip-text"></p>
        </div>
    </main>

    <footer class="footer">MirageRP</footer>

    <script src="script.js"></script>
</body>
</html>
