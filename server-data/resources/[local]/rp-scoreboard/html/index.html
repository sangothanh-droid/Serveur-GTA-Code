<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scoreboard" class="scoreboard hidden">
        <div class="scoreboard-header">
            <span class="scoreboard-title">MirageRP</span>
            <span id="scoreboard-count" class="scoreboard-count">0 / 0 joueurs connectés</span>
        </div>
        <table class="scoreboard-table">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>ID</th>
                    <th>Ping</th>
                </tr>
            </thead>
            <tbody id="scoreboard-body"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
